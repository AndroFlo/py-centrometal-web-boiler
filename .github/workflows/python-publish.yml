# Publishes the package to PyPI when a GitHub release is published.
# The release tag must be equal to the version in pyproject.toml (e.g. 0.1.0).
# Uses PyPI Trusted Publishing: no token, the "pypi" environment must match the
# publisher configured on pypi.org for py-centrometal-web-boiler-androflo.

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/py-centrometal-web-boiler-androflo/
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check that the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version $version in pyproject.toml"
            exit 1
          fi
      - name: Tests
        run: |
          pip install -e ".[test]"
          pytest
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
