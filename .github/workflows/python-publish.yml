# Builds the package and publishes it to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing: no token, the "pypi" environment must match the
# publisher configured on pypi.org for py-centrometal-web-boiler-androflo.

name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/py-centrometal-web-boiler-androflo/
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
